name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and apply custom changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/AIsouler/MyClash.git || git remote set-url upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream main

          git merge upstream/main --no-edit -X theirs

          sed -i 's/    '\''MATCH,漏网之鱼'\''/    '\''MATCH,直连'\''/' Script/Script.js
          sed -i 's/    '\''MATCH,漏网之鱼'\''/    '\''MATCH,直连'\''/' Script/mihomoScript.js
          sed -i 's/  - MATCH,漏网之鱼/  - MATCH,直连/' Config/mihomoConfig.yaml
          sed -i 's/  - MATCH,漏网之鱼/  - MATCH,直连/' Config/mihomoConfigLite.yaml

          # 重新注入 Tailscale 自定义配置（幂等，可重复执行）
          python3 .github/apply-tailscale.py

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add Config/mihomoConfig.yaml Config/mihomoConfigLite.yaml Script/Script.js Script/mihomoScript.js Test/suites/integration.js .github/apply-tailscale.py
            git commit -m "chore: apply custom patches (MATCH direct / Tailscale)"
            git push
          fi
