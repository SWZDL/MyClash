name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and apply custom changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/AIsouler/MyClash.git || git remote set-url upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream"
          else
            # Keep this fork's workflows unchanged: GITHUB_TOKEN cannot push
            # commits that create or modify files under .github/workflows.
            git merge upstream/main --no-commit --no-ff -X theirs
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit --no-edit
          fi

          sed -i 's/    '\''MATCH,漏网之鱼'\''/    '\''MATCH,直连'\''/' Script/Script.js
          sed -i 's/    '\''MATCH,漏网之鱼'\''/    '\''MATCH,直连'\''/' Script/mihomoScript.js
          sed -i 's/  - MATCH,漏网之鱼/  - MATCH,直连/' Config/mihomoConfig.yaml
          sed -i 's/  - MATCH,漏网之鱼/  - MATCH,直连/' Config/mihomoConfigLite.yaml

          # 重新注入 Tailscale 自定义配置（幂等，可重复执行）
          python3 .github/apply-tailscale.py

          if ! git diff --quiet; then
            git add Config/mihomoConfig.yaml Config/mihomoConfigLite.yaml Script/Script.js Script/mihomoScript.js Test/suites/integration.js .github/apply-tailscale.py
            git commit -m "chore: apply custom patches (MATCH direct / Tailscale)"
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No changes to push"
          else
            git push origin HEAD:main
          fi
